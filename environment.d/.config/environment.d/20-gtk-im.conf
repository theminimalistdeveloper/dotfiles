# Force GTK apps (e.g. Ghostty, which uses the GTK runtime) to use their
# built-in dead-key / compose handling on Wayland.
#
# Since GTK 4.20, GTK apps defer dead-key & compose-key composition to the
# compositor's text-input protocol (zwp_text_input_v3) when present. Sway does
# not provide it, so accents (á é í ó ú ñ etc.) are silently dropped.
# GTK_IM_MODULE=simple restores GTK's own (X11-style) dead-key handling.
GTK_IM_MODULE=simple
